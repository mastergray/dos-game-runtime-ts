<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Manifest games</title>
    <style>
        /* IBM VGA 8x16 from The Ultimate Oldschool PC Font Pack (VileR, int10h.org), CC BY-SA 4.0; see fonts/LICENSE.TXT. */
        @font-face { font-family: "IBM VGA"; src: url("./fonts/WebPlus_IBM_VGA_8x16.woff") format("woff"); font-display: block; }

        /* The same palette and tokens as the game pages: BIOS grey chrome, a Norton-style blue panel. */
        :root {
            --black: #000000; --dark-gray: #555555; --light-gray: #aaaaaa; --white: #ffffff;
            --blue: #0000aa; --yellow: #ffff55; --light-cyan: #55ffff;
            --panel-bg: var(--blue); --panel-fg: var(--white); --panel-border: var(--white); --panel-shadow: var(--black);
            --select-bg: var(--light-cyan); --select-fg: var(--black); --muted-fg: var(--light-gray);
            --cell: 16px;
            color-scheme: dark;
        }
        @media (min-height: 720px) and (min-width: 900px) { :root { --cell: 24px; } }

        html, body { margin: 0; padding: 0; min-height: 100%; background: var(--black); color: var(--light-gray);
                     font: var(--cell) / 1 "IBM VGA", "Courier New", monospace; -webkit-font-smoothing: none; }
        body { display: flex; flex-direction: column; align-items: center; gap: var(--cell);
                padding: calc(var(--cell) + env(safe-area-inset-top)) calc(1ch + env(safe-area-inset-right)) calc(var(--cell) + env(safe-area-inset-bottom)) calc(1ch + env(safe-area-inset-left)); box-sizing: border-box; }

        h1 { margin: 0; font-size: calc(var(--cell) * 2); line-height: 1; color: var(--white); font-weight: normal; text-align: center; }
        h1::before { content: "═══ "; color: var(--dark-gray); }
        h1::after { content: " ═══"; color: var(--dark-gray); }
        p.lead { margin: 0; max-width: 60ch; text-align: center; line-height: 1.25; }

        /* The panel: a dialog like each game's menu, holding the list. */
        .panel { position: relative; background: var(--panel-bg); color: var(--panel-fg); border: 4px double var(--panel-border); outline: 1px solid var(--panel-bg);
                  box-shadow: 1ch 1em 0 var(--panel-shadow); padding: 1.25em 2ch 1em; width: min(96vw, 84ch); box-sizing: border-box; margin-top: 0.75em; }
        .panel h2 { position: absolute; top: -0.75em; left: 50%; transform: translateX(-50%); margin: 0; padding: 0 1ch; font-size: inherit; font-weight: normal;
                     background: var(--panel-bg); color: var(--yellow); white-space: nowrap; }
        .list { display: grid; grid-template-columns: 1fr; gap: 0.25em; }
        @media (min-width: 700px) { .list { grid-template-columns: 1fr 1fr; column-gap: 2ch; } }
        .game { display: grid; grid-template-columns: 2ch 1fr; grid-template-rows: auto auto; column-gap: 0; padding: 0.25em 1ch 0.25em 0; line-height: 1.25;
                 color: var(--panel-fg); text-decoration: none; }
        .game::before { content: "  "; white-space: pre; grid-row: 1 / span 2; }
        .game .name { grid-column: 2; }
        .game .meta { grid-column: 2; color: var(--muted-fg); font-size: 0.85em; }
        .game:hover, .game:focus-visible { background: var(--select-bg); color: var(--select-fg); outline: none; }
        .game:hover::before, .game:focus-visible::before { content: "► "; }
        .game:hover .meta, .game:focus-visible .meta { color: var(--select-fg); }
        .game:active { opacity: 0.8; }
        .game.unplayed .name::after { content: " ?"; color: var(--yellow); }
        .game.unplayed:hover .name::after, .game.unplayed:focus-visible .name::after { color: var(--select-fg); }

        footer { color: var(--dark-gray); text-align: center; line-height: 1.25; max-width: 60ch; }
        footer a { color: var(--light-gray); }
        footer .mark { color: var(--yellow); }
    </style>
</head>
<body>
    <h1>MANIFEST GAMES</h1>
    <p class="lead">Every game with a manifest, listed from its metadata. Each page saves to this browser and works on a phone.</p>
    <div class="panel">
        <h2>SELECT A GAME</h2>
        <nav class="list">
{{games}}
        </nav>
    </div>
    <footer>{{count}} games · Tap a title to play. A <span class="mark">?</span> marks a page nobody has played yet. The <a href="/games">hand pages</a> are the baseline.</footer>
</body>
</html>
